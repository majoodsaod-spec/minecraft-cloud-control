name: Dashboard checks

on:
  workflow_dispatch:
  push:
    paths:
      - "public/**"
      - "desktop/ui/**"
      - "src/**"
      - "server/**"
      - "tests/**"
      - ".github/workflows/dashboard-checks.yml"
  pull_request:
    paths:
      - "public/**"
      - "desktop/ui/**"
      - "src/**"
      - "server/**"
      - "tests/**"
      - ".github/workflows/dashboard-checks.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Check server Python syntax
        run: python -m compileall -q server
      - name: Run server tests
        run: python -m unittest discover -s tests -v
      - name: Validate Phase 2 unified server file queue
        run: |
          node --check desktop/ui/server_management.js
          node --check desktop/ui/change_queue.js
          node --test tests/test_phase2_queue.mjs
      - name: Validate installed plugin and player management
        run: |
          node --check desktop/ui/marketplace.js
          node --check desktop/ui/players.js
          node --test tests/test_phase2_management.mjs
      - name: Check browser JavaScript syntax
        run: |
          node --check public/dashboard-live.js
          node --check public/dashboard-pro.js
      - name: Check Cloudflare Worker JavaScript syntax
        run: |
          node --input-type=module --check < src/worker.js
          node --input-type=module --check < src/bridge.js
      - name: Test desktop server lifecycle handoff and progress
        run: |
          node --check desktop/ui/server_lifecycle.js
          node --test tests/test_server_lifecycle.mjs
      - name: Test live bridge free-tier behavior
        run: node --test tests/test_bridge_free_tier.mjs
      - name: Verify shared Cloudflare and Windows interface system
        run: node --test tests/test_unified_ui.mjs
