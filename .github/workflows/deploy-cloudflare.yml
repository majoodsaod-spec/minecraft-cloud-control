name: Deploy Cloudflare dashboard

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-dashboard-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate dashboard and Worker JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check public/dashboard-live.js
          node --check public/dashboard-pro.js
          node --input-type=module --check < src/worker.js
          node --input-type=module --check < src/bridge.js
      - name: Confirm required deployment credentials are present
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CF_TOKEN" || -z "$CF_ACCOUNT" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub repository Actions secrets to enable GitHub-managed deployments."
            exit 1
          fi
      - name: Deploy Worker and dashboard assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Deployment summary
        if: success()
        run: |
          {
            echo "### Cloudflare dashboard deployed from GitHub"
            echo "- Worker: `minecraft-cloud-control`"
            echo "- Source revision: `$GITHUB_SHA`"
            echo "- Dashboard assets and live bridge deployed together"
            echo "- Existing Worker secrets are not modified"
          } >> "$GITHUB_STEP_SUMMARY"
