name: Continuous Paper Minecraft Server

on:
  workflow_dispatch:
    inputs:
      previous_run:
        description: "Previous verified backup run ID (leave blank for latest available backup)"
        required: false
        type: string
  schedule:
    # Recovery check every day, including across month boundaries (30-day continuity).
    - cron: "17 3 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: continuous-paper-server
  cancel-in-progress: false

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    outputs:
      backed_up: ${{ steps.backedup.outputs.ready }}
      stop_requested: ${{ steps.paper.outputs.stop_requested }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Respect Cloudflare dashboard power state
        id: power
        env:
          CONTROL_URL: ${{ secrets.CLOUDFLARE_CONTROL_URL }}
          BRIDGE_TOKEN: ${{ secrets.CLOUDFLARE_BRIDGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python server/check_power.py
      - name: Select backup and prevent overlapping scheduled launches
        if: steps.power.outputs.enabled == 'true'
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN: ${{ inputs.previous_run }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            # Daily recovery must not interrupt a healthy handoff chain.
            active=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/paper-state-test.yml/runs?per_page=30" \
              --jq '[.workflow_runs[] | select((.status == "in_progress" or .status == "queued" or .status == "waiting") and .id != (env.GITHUB_RUN_ID | tonumber))] | length')
            if [[ "$active" != "0" ]]; then
              echo "A continuous server run is already active; skipping recovery."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          run_id="$PREVIOUS_RUN"
          if [[ -z "$run_id" ]]; then
            run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=minecraft-world&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          fi
          if [[ -n "$run_id" ]]; then
            echo "Restoring snapshot from GitHub run $run_id"
            mkdir -p previous
            for attempt in 1 2 3 4 5; do
              if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n minecraft-world -D previous; then
                break
              fi
              if [[ "$attempt" == 5 ]]; then
                echo "::error::Required backup from run $run_id could not be retrieved"
                exit 1
              fi
              sleep 15
            done
            # An intentional safe stop is recorded with the latest verified
            # world backup. Scheduled recovery must respect it even when the
            # Cloudflare desired-power endpoint is unavailable.
            if [[ "$EVENT_NAME" == "schedule" && -f previous/stop-requested ]]; then
              echo "Latest verified backup requested offline state; skipping scheduled recovery."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "REQUIRE_RESTORE=true" >> "$GITHUB_ENV"
          else
            echo "No existing backup found; first-time new world"
            echo "REQUIRE_RESTORE=false" >> "$GITHUB_ENV"
          fi
      - name: Install server configuration dependencies
        if: steps.power.outputs.enabled == 'true' && steps.select.outputs.skip != 'true'
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Start player tunnel (if configured)
        if: steps.power.outputs.enabled == 'true' && steps.select.outputs.skip != 'true'
        env:
          PLAYIT_SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PLAYIT_SECRET_KEY" ]]; then
            docker run -d --name minecraft-playit --network host \
              -e "SECRET_KEY=$PLAYIT_SECRET_KEY" ghcr.io/playit-cloud/playit-agent:latest
            echo "Playit tunnel started"
          else
            echo "::warning::PLAYIT_SECRET_KEY is missing; remote players cannot connect to the GitHub runner."
          fi
      - name: Connect private NetBird management network
        if: steps.power.outputs.enabled == 'true' && steps.select.outputs.skip != 'true'
        shell: bash
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
          DIRECT_TOKEN: ${{ secrets.MINECRAFT_DIRECT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$NETBIRD_SETUP_KEY" || -z "$DIRECT_TOKEN" ]]; then
            echo "::warning::Direct Windows console is disabled until NETBIRD_SETUP_KEY and MINECRAFT_DIRECT_TOKEN secrets are configured."
            exit 0
          fi
          # A failed optional VPN must not prevent Paper startup or world backups.
          if ! (curl -fsSL --max-time 40 https://pkgs.netbird.io/install.sh -o "$RUNNER_TEMP/netbird-install.sh" &&
                sudo bash "$RUNNER_TEMP/netbird-install.sh" >/dev/null); then
            echo "::warning::NetBird installation unavailable; starting Paper normally."
            exit 0
          fi
          if ! sudo netbird up --setup-key "$NETBIRD_SETUP_KEY" --hostname "minecraft-paper-$GITHUB_RUN_ID" >/dev/null 2>&1; then
            echo "::warning::NetBird connection failed; starting Paper normally."
            exit 0
          fi
          private_ip="$(sudo netbird status --ipv4 2>/dev/null | tr -d '\r\n' | cut -d/ -f1)"
          if ! python -c 'import ipaddress,sys; ip=ipaddress.ip_address(sys.argv[1]); sys.exit(not(ip.version==4 and ip in ipaddress.ip_network("100.64.0.0/10")))' "$private_ip"; then
            # Strict IP validation happens again in Python's direct control.
            echo "::warning::NetBird private IP not ready; live direct control unavailable."
            exit 0
          fi
          echo "NETBIRD_IP=$private_ip" >> "$GITHUB_ENV"
          echo "NetBird private Paper peer registered: minecraft-paper-$GITHUB_RUN_ID"
      - name: Run Paper until restart condition
        id: paper
        if: steps.power.outputs.enabled == 'true' && steps.select.outputs.skip != 'true'
        shell: bash
        env:
          CLOUDFLARE_CONTROL_URL: ${{ secrets.CLOUDFLARE_CONTROL_URL }}
          CLOUDFLARE_BRIDGE_TOKEN: ${{ secrets.CLOUDFLARE_BRIDGE_TOKEN }}
          MINECRAFT_DIRECT_TOKEN: ${{ secrets.MINECRAFT_DIRECT_TOKEN }}
          GEYSER_PLAYIT_CONFIG: ${{ secrets.GEYSER_PLAYIT_CONFIG }}
          CHUNKY_PREGEN_RADIUS: ${{ vars.CHUNKY_PREGEN_RADIUS }}
        run: |
          python server/continuous_paper.py
          if [[ -f cycle-output/stop-requested ]]; then
            echo "stop_requested=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload verified world backup
        id: backup
        if: success() && steps.power.outputs.enabled == 'true' && steps.select.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-world
          path: |
            cycle-output/worlds.zip
            cycle-output/worlds.zip.sha256
            cycle-output/stop-requested
          retention-days: 90
          if-no-files-found: error
      - name: Confirm saved and stopped
        if: success() && steps.power.outputs.enabled == 'true' && steps.select.outputs.skip != 'true'
        env:
          CONTROL_URL: ${{ secrets.CLOUDFLARE_CONTROL_URL }}
          BRIDGE_TOKEN: ${{ secrets.CLOUDFLARE_BRIDGE_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$CONTROL_URL" && -n "$BRIDGE_TOKEN" ]]; then
            curl -fsS --retry 3 --max-time 15 -X POST \
              -H "Authorization: Bearer $BRIDGE_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"session\":\"$GITHUB_RUN_ID\",\"phase\":\"stopped\",\"detail\":\"Verified backup uploaded successfully\"}" \
              "${CONTROL_URL%/}/api/bridge-event" || echo "::warning::Could not update dashboard shutdown status"
          fi
      - name: Mark completed backup
        if: success() && steps.power.outputs.enabled == 'true' && steps.select.outputs.skip != 'true'
        run: echo "ready=true" >> "$GITHUB_OUTPUT"
        id: backedup

  next_session:
    needs: minecraft
    if: needs.minecraft.result == 'success' && needs.minecraft.outputs.backed_up == 'true' && needs.minecraft.outputs.stop_requested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check whether dashboard requested stop
        id: power
        env:
          CONTROL_URL: ${{ secrets.CLOUDFLARE_CONTROL_URL }}
          BRIDGE_TOKEN: ${{ secrets.CLOUDFLARE_BRIDGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python server/check_power.py
      - name: Dispatch a fresh workflow run (new six-hour runner budget)
        if: steps.power.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run paper-state-test.yml --repo "$GITHUB_REPOSITORY" \
            --ref "${GITHUB_REF_NAME}" -f previous_run="$GITHUB_RUN_ID"
          echo "Successor run dispatched with backup from $GITHUB_RUN_ID"

  cleanup_backups:
    needs: minecraft
    # Cleanup happens only after a newly verified world archive was uploaded.
    # It is safe whether the dashboard asked for a stop or a restart.
    if: needs.minecraft.result == 'success' && needs.minecraft.outputs.backed_up == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Delete surplus Minecraft world backups, never the latest five
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub can take a moment to index the just-uploaded artifact.
          # Never delete anything until we can see this run's fresh backup.
          for attempt in 1 2 3 4; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=minecraft-world&per_page=100" \
              --jq '.artifacts[] | select(.expired == false and .name == "minecraft-world") | [.created_at, (.id|tostring), (.workflow_run.id|tostring), (.size_in_bytes|tostring)] | @tsv' \
              > "$RUNNER_TEMP/world-artifacts.tsv"
            python server/prune_backups.py --current-run "$GITHUB_RUN_ID" \
              < "$RUNNER_TEMP/world-artifacts.tsv" > "$RUNNER_TEMP/to-delete.tsv"
            if grep -q $'\t' "$RUNNER_TEMP/world-artifacts.tsv" &&
               awk -F '\t' -v id="$GITHUB_RUN_ID" '$3 == id { found=1 } END { exit !found }' "$RUNNER_TEMP/world-artifacts.tsv"; then
              break
            fi
            if [[ "$attempt" == 4 ]]; then
              echo "::warning::Fresh world backup is not yet visible via GitHub API; preserving all backups."
              exit 0
            fi
            sleep 10
          done
          count=0
          bytes=0
          while IFS=$'\t' read -r artifact_id size; do
            [[ -n "$artifact_id" ]] || continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
            count=$((count + 1))
            bytes=$((bytes + size))
          done < "$RUNNER_TEMP/to-delete.tsv"
          echo "Deleted $count redundant older world backups; reclaimed approximately $((bytes / 1048576)) MiB."
          {
            echo "### Minecraft world backup storage"
            echo "- Kept the 5 newest verified backup artifacts."
            echo "- Deleted $count older backup artifacts."
            echo "- Reclaimed approximately $((bytes / 1048576)) MiB."
            echo "- Kept the newly uploaded backup for run $GITHUB_RUN_ID."
          } >> "$GITHUB_STEP_SUMMARY"
