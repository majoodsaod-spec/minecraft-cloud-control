name: Build Minecraft Cloud Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "tests/test_desktop_updater.mjs"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

concurrency:
  group: minecraft-desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: Windows 11 · native NSIS installer
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Check out desktop source
        uses: actions/checkout@v5
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Set up Python for installer icon
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Create polished native Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python desktop/scripts/make_icon.py
      - name: Validate desktop frontend JavaScript
        shell: pwsh
        run: |
          node --check desktop/ui/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check desktop/ui/marketplace.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check desktop/ui/server_management.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/test_desktop_updater.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Modrinth server-side plugin and datapack installer
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_modrinth_marketplace.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native Rust NetBird peer and connection regression tests
        working-directory: desktop/src-tauri
        shell: pwsh
        run: |
          cargo test --lib netbird_lifecycle_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Tauri CLI
        shell: pwsh
        run: |
          cargo install tauri-cli --version "^2" --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Give each successful installer an upgrade version
        shell: pwsh
        run: |
          $path = "desktop/src-tauri/tauri.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.version = "0.1.${{ github.run_number }}"
          $config | ConvertTo-Json -Depth 30 | Set-Content -Path $path -Encoding utf8
      - name: Compile Windows app and create installer
        working-directory: desktop
        shell: pwsh
        env:
          MC_DESKTOP_BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          # A transient 429/5xx from GitHub's NSIS binary release CDN must not
          # turn an otherwise successful Rust compilation into a failed update.
          # Retry packaging only for a recognizable temporary download error.
          $attempts = 5
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            Write-Host "Windows installer packaging attempt $attempt/$attempts"
            & cargo tauri build --bundles nsis *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\tauri-nsis-build.log"
            $result = $LASTEXITCODE
            if ($result -eq 0) { exit 0 }
            $log = Get-Content "$env:RUNNER_TEMP\tauri-nsis-build.log" -Raw
            $temporaryDownloadError = $log -match 'http status: (429|500|502|503|504)' -or
              ($log -match 'failed to bundle project' -and $log -match '(timed out|connection reset|network error)')
            if (-not $temporaryDownloadError -or $attempt -eq $attempts) {
              Write-Error "Installer packaging failed. Exit code: $result. No safe retry condition remaining."
              exit 1
            }
            $delay = [Math]::Min(60, 10 * $attempt)
            Write-Warning "Temporary NSIS download error; retrying packaging in $delay seconds."
            Start-Sleep -Seconds $delay
          }
      - name: Upload Windows setup executable
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Cloud-Windows-Installer
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Build summary
        shell: pwsh
        run: |
          @"
          ### Minecraft Cloud Desktop
          - Windows installer built from source: `$env:GITHUB_SHA`
          - Go to **Actions → Build Minecraft Cloud Windows installer → Artifacts**
          - Download **Minecraft-Cloud-Windows-Installer** and extract the ZIP to run the installer
          - The executable is not code-signed; Windows SmartScreen may show a warning
          - Tokens are entered inside the installed app and stored by Windows Credential Manager
          "@ >> $env:GITHUB_STEP_SUMMARY
