name: Restart Policy Tests

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "tests/**"
      - ".github/workflows/restart-policy-tests.yml"
  pull_request:
    paths:
      - "server/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test restart decisions
        run: python -m unittest discover -s tests -v
