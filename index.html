<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b111c"><title>Minecraft Cloud — Control Panel</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#e8eef7;background:#0b111c;color-scheme:dark}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:#0d1522;border-right:1px solid #243044;padding:25px 16px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;height:100vh}
.brand{font-size:20px;font-weight:800;letter-spacing:-.65px;padding:6px 12px 22px;display:flex;gap:10px;align-items:center}.brand .cube{background:#235f47;color:#a8f0ba;padding:8px;border-radius:11px}
.nav{width:100%;border:0;background:transparent;color:#9eafc5;padding:12px 14px;text-align:left;border-radius:10px;font-weight:600;display:flex;align-items:center;gap:12px}
.nav:hover,.nav.active{background:#1b2f34;color:#9be2b3}.nav .ico{font-size:18px;width:22px;text-align:center}.navfoot{margin-top:auto;padding:15px 12px;color:#73869d;font-size:12px;line-height:1.6}
main{min-width:0;padding:32px clamp(18px,4vw,56px);max-width:1520px;width:100%;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:28px;flex-wrap:wrap}.eyebrow{color:#8aa0b8;font-size:12px;text-transform:uppercase;letter-spacing:1.3px;font-weight:800}h1{font-size:30px;margin:4px 0 0;letter-spacing:-.9px}h2{font-size:19px;margin:0 0 12px}p{line-height:1.6}.muted{color:#91a2b9}.small{font-size:13px}.badge{display:inline-flex;border:1px solid #465267;color:#aebbcf;padding:8px 12px;border-radius:999px;font-weight:750;font-size:12px;gap:7px;align-items:center}.badge .dot{width:8px;height:8px;border-radius:50%;background:#d69a47}
.panel{background:#121e2c;border:1px solid #263449;border-radius:16px;padding:22px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:22px}.stat b{font-size:29px;display:block;margin:12px 0 6px}.stat span{font-size:12px;color:#8fa2bb}.section{margin:24px 0}.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.btn{border:1px solid #405066;background:#26374a;color:#e8eef7;padding:11px 16px;border-radius:10px;font-weight:750}.btn:hover:not(:disabled){filter:brightness(1.16)}.btn.primary{background:#229669;border-color:#2fba83;color:#061d15}.btn.danger{background:#4c2933;border-color:#7c3b48;color:#ffb6c3}.btn.outline{background:transparent}.search,input[type=text],input[type=number],select,textarea{width:100%;background:#0d1724;color:#e6edf7;border:1px solid #35445a;border-radius:10px;padding:11px 13px;outline:none}.search:focus,input:focus,textarea:focus,select:focus{border-color:#55b995}.search{max-width:500px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}.rowsetting{display:flex;gap:20px;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid #263449}.rowsetting:last-child{border-bottom:0}.rowsetting strong{font-size:14px}.rowsetting code{display:block;color:#7890a8;font-size:11px;margin-top:4px;overflow-wrap:anywhere}.rowsetting .desc{color:#9badc2;font-size:12px;margin-top:5px}.control{width:155px;flex-shrink:0}.switch{width:48px;height:28px;background:#485569;border:0;border-radius:30px;padding:4px;display:flex;align-items:center;transition:.15s}.switch:after{content:"";width:20px;height:20px;border-radius:50%;background:white;transition:transform .15s}.switch.on{background:#248e67}.switch.on:after{transform:translateX(20px)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.tab{border:1px solid #34455a;border-radius:9px;background:transparent;color:#9cb0c7;padding:9px 12px}.tab.active{background:#254c41;border-color:#478f71;color:#c5ffdb}
.notice{border:1px solid #6a5637;background:#2c271f;border-radius:12px;color:#efd19d;padding:14px 17px;font-size:13px;line-height:1.55;margin:16px 0}.drop{border:2px dashed #476477;border-radius:15px;text-align:center;padding:45px 20px;background:#101e2d;cursor:pointer}.drop.drag{background:#1c413a;border-color:#55c691}.drop h2{margin:0}.filetable{width:100%;border-collapse:collapse}.filetable td,.filetable th{padding:14px 9px;border-bottom:1px solid #263449;text-align:left;font-size:13px}.filetable th{color:#8b9eb7;font-size:12px}.tag{font-size:11px;border:1px solid #3c5362;padding:5px 8px;border-radius:7px;color:#a5bccf}
.console{min-height:250px;background:#080e16;border:1px solid #29374d;border-radius:10px;color:#92daa7;padding:18px;white-space:pre-wrap;font:12px/1.7 ui-monospace,Consolas,monospace}.empty{padding:32px;text-align:center;color:#99aabe}.hidden{display:none!important}.toast{position:fixed;bottom:22px;right:22px;padding:13px 18px;background:#223a32;border:1px solid #528f75;border-radius:11px;color:#e6fff0;box-shadow:0 10px 30px #0008;z-index:5}.tiny{font-size:11px;color:#8497ae}.progress{height:5px;background:#293748;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:#43b787;width:45%}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.shell{display:block}.sidebar{position:static;height:auto;padding:10px}.brand{padding:8px}.navs{display:flex;overflow:auto;gap:3px}.nav{width:auto;white-space:nowrap;padding:9px 11px;font-size:12px}.navfoot{display:none}main{padding:20px 14px}.grid{grid-template-columns:1fr 1fr}.rowsetting{align-items:flex-start}.control{width:115px}h1{font-size:25px}}
</style></head><body>
<div class="shell"><aside class="sidebar">
<div class="brand"><span class="cube">▣</span>Minecraft Cloud</div>
<div class="navs" id="nav"></div><div class="navfoot">Control panel v0.1<br>Frontend preview · No server connected</div>
</aside><main>
<div class="top"><div><div class="eyebrow">Minecraft Control Center</div><h1 id="pageTitle">Overview</h1></div><span class="badge"><span class="dot"></span> Not connected</span></div>
<div id="page"></div></main></div><div id="toast" class="toast hidden" role="status"></div>
<script>
"use strict";
const menu=[["overview","▦","Overview"],["settings","⚙","Server Settings"],["plugins","⬡","Plugins"],["files","▤","File Manager"],["worlds","◈","Worlds & Backups"],["players","♙","Players"],["console","⌘","Console"],["about","ⓘ","Connections"]];
const sections=["All","General","Gameplay","World","Network","Paper"];
const schema=[
["motd","Server MOTD","General","text","A Minecraft Server","Message shown in the multiplayer list"],
["max-players","Player slot limit","General","number",1000000,"High default cap; actual capacity depends on CPU/RAM/network",1,2147483647],
["difficulty","Difficulty","Gameplay","select","normal","World difficulty",["peaceful","easy","normal","hard"]],
["gamemode","Default gamemode","Gameplay","select","survival","Default game mode",["survival","creative","adventure","spectator"]],
["pvp","Enable PvP","Gameplay","bool",true,"Allow players to damage each other"],
["allow-flight","Allow flight","Gameplay","bool",false,"Allow flying players without kick"],
["white-list","Whitelist","Gameplay","bool",true,"Only permitted players can join"],
["enforce-whitelist","Enforce whitelist","Gameplay","bool",true,"Kick non-whitelisted players"],
["online-mode","Online mode","Network","bool",true,"Authenticate Minecraft accounts; keep enabled"],
["server-port","Server port","Network","number",25565,"Local Minecraft TCP port",1,65535],
["enable-command-block","Command blocks","Gameplay","bool",false,"Allow command blocks"],
["spawn-protection","Spawn protection","World","number",16,"Protected radius around spawn",0,256],
["view-distance","View distance","World","number",10,"Server chunk view distance",2,32],
["simulation-distance","Simulation distance","World","number",6,"Server simulation distance",2,32],
["max-world-size","Maximum world size","World","number",29999984,"World border limit",1,29999984],
["allow-nether","Allow Nether","World","bool",true,"Enable Nether dimension"],
["spawn-monsters","Spawn monsters","World","bool",true,"Allow hostile mob spawning"],
["spawn-animals","Spawn animals","World","bool",true,"Allow animal spawning"],
["spawn-npcs","Spawn NPCs","World","bool",true,"Allow villager and NPC spawning"],
["hardcore","Hardcore mode","Gameplay","bool",false,"Hardcore world behavior"],
["force-gamemode","Force default gamemode","Gameplay","bool",false,"Force gamemode on join"],
["player-idle-timeout","Idle kick time (minutes)","General","number",0,"0 means disabled",0,1440],
["enable-rcon","Enable RCON","Network","bool",false,"Requires a strong password and secure networking"],
["allow-headless-pistons","Allow headless pistons","Paper","bool",false,"Planned Paper configuration; exact key depends on selected Paper version"]
];
const defaults=Object.fromEntries(schema.map(x=>[x[0],x[4]]));
const safeLoad=()=>{try{return JSON.parse(localStorage.getItem("mccloud-settings")||"{}")}catch{return {}}};
let settings={...defaults,...safeLoad()}, tab="overview", category="All", search="", plugins=[], uploaded=[], pendingFiles=[];
if(settings["max-players"]===5&&!localStorage.getItem("mccloud-player-limit-v2")){settings["max-players"]=1000000;localStorage.setItem("mccloud-settings",JSON.stringify(settings))}
localStorage.setItem("mccloud-player-limit-v2","1");
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(message){const n=document.getElementById("toast");n.textContent=message;n.classList.remove("hidden");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.classList.add("hidden"),3500)}
function persist(){localStorage.setItem("mccloud-settings",JSON.stringify(settings))}
function button(label,handler,cls=""){const b=document.createElement("button");b.className="btn "+cls;b.textContent=label;b.addEventListener("click",handler);return b}
function init(){document.getElementById("nav").innerHTML=menu.map(([id,icon,label])=>'<button class="nav" data-nav="'+id+'"><span class="ico">'+icon+'</span>'+label+'</button>').join("");document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("[data-nav]");if(b){tab=b.dataset.nav;render()}});render()}
function render(){document.getElementById("pageTitle").textContent=menu.find(x=>x[0]===tab)[2];document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.nav===tab));const p=document.getElementById("page");p.innerHTML="";({overview,settingsPage,pluginsPage,filesPage,worldsPage,playersPage,consolePage,aboutPage})[({overview:"overview",settings:"settingsPage",plugins:"pluginsPage",files:"filesPage",worlds:"worldsPage",players:"playersPage",console:"consolePage",about:"aboutPage"})[tab]](p)}
function element(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function addNotice(parent,message){parent.append(element("div","notice",message))}
function overview(p){const cards=element("div","grid");[["Server","Offline"],["Players","— / "+(settings["max-players"]>=1000000?"Unlimited":settings["max-players"])],["RAM","Not connected"],["Software","Paper · planned"]].forEach(([a,b])=>{const n=element("div","panel stat");n.innerHTML='<span>'+a+'</span><b>'+escapeHtml(b)+'</b><span>Backend integration required</span>';cards.append(n)});p.append(cards);
const sec=element("div","panel section");sec.innerHTML='<h2>Server controls</h2><p class="muted small">These actions require a connected Minecraft-compatible server backend and secure command API.</p>';const controls=element("div","flex");["▶ Start","■ Stop","↻ Restart","☁ Backup"].forEach(x=>{const b=button(x,()=>{},x.includes("Start")?"primary":"outline");b.disabled=true;b.title="Backend not connected";controls.append(b)});sec.append(controls);p.append(sec);addNotice(p,"Preview mode: this website does not launch a Minecraft server, upload files, or run GitHub Actions. Your configuration edits are saved only in this browser.");const links=element("div","panel");links.innerHTML='<h2>Quick access</h2><p class="muted">Find every configuration with search, toggle booleans, stage plugin JARs, and export a draft server.properties file.</p>';const b=button("Open server settings →",()=>{tab="settings";render()},"primary");links.append(b);p.append(links)}
function settingsPage(p){const info=element("p","muted small","Edit settings using switches, inputs and dropdowns. Changes are local drafts until the server backend is connected. Paper options are placeholders until version-specific schema support is added.");p.append(info);
const bar=element("div","toolbar");const s=element("input","search");s.placeholder="Search all settings (e.g. piston, PvP, distance)...";s.value=search;s.setAttribute("aria-label","Search settings");s.oninput=()=>{search=s.value;drawRows()};bar.append(s);bar.append(button("Export server.properties",exportProperties,"primary"));p.append(bar);
const cat=element("div","tabs");sections.forEach(x=>{const b=element("button","tab"+(x===category?" active":""),x);b.onclick=()=>{category=x;render()};cat.append(b)});p.append(cat);
const slotHelp=element("div","notice","Player slots: 1,000,000 is treated as effectively unlimited in the dashboard. This is a high numeric cap, not a promise of unlimited server performance.");p.append(slotHelp);
const list=element("div","panel");list.id="settingsList";p.append(list);drawRows();
const actions=element("div","flex section");actions.append(button("Reset to defaults",()=>{if(confirm("Reset all local draft settings to defaults?")){settings={...defaults};persist();render();toast("Draft settings reset")}},"outline"));actions.append(button("Download JSON draft",()=>download("minecraft-settings-draft.json",JSON.stringify(settings,null,2),"application/json"),"outline"));p.append(actions)}
function drawRows(){const root=document.getElementById("settingsList");if(!root)return;root.innerHTML="";const values=schema.filter(x=>(category==="All"||x[2]===category)&&[x[0],x[1],x[5]].join(" ").toLowerCase().includes(search.toLowerCase()));if(!values.length){root.append(element("div","empty","No matching settings"));return}
for(const x of values){const [key,label,group,type,,description]=x;const row=element("div","rowsetting");const left=element("div","");left.innerHTML='<strong>'+escapeHtml(label)+'</strong><code>'+escapeHtml(key)+'</code><div class="desc">'+escapeHtml(description)+'</div>';row.append(left);const ctl=element("div","control");let el;if(type==="bool"){el=element("button","switch"+(settings[key]?" on":""));el.setAttribute("role","switch");el.setAttribute("aria-checked",String(!!settings[key]));el.setAttribute("aria-label",label);el.onclick=()=>{settings[key]=!settings[key];persist();el.classList.toggle("on",settings[key]);el.setAttribute("aria-checked",String(settings[key]))}}else if(type==="select"){el=element("select");x[6].forEach(value=>{const opt=element("option","",value);opt.value=value;el.append(opt)});el.value=settings[key];el.onchange=()=>{settings[key]=el.value;persist()}}else{el=element("input");el.type=type==="number"?"number":"text";el.value=settings[key];if(type==="number"){el.min=x[6];el.max=x[7]}el.onchange=()=>{const value=type==="number"?Number(el.value):el.value;if(type==="number"&&(!Number.isFinite(value)||value<x[6]||value>x[7])){toast("Value must be between "+x[6]+" and "+x[7]);el.value=settings[key];return}settings[key]=value;persist()}}ctl.append(el);row.append(ctl);root.append(row)}}
function exportProperties(){const lines=["# Minecraft Cloud local draft — not automatically applied","# Paper-specific settings must be configured in Paper YAML files.",""];for(const x of schema){if(x[2]==="Paper")continue;lines.push(x[0]+"="+settings[x[0]])}download("server.properties",lines.join("\n"),"text/plain");toast("Downloaded server.properties draft")}
function download(name,content,type){const blob=new Blob([content],{type}),a=document.createElement("a"),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function pluginsPage(p){addNotice(p,"Plugin files are not uploaded yet. This page validates and stages filenames locally for the future secure upload API. No plugin will run on the server.");const drop=element("div","drop");drop.innerHTML='<h2>⬆ Drag & drop plugin JARs</h2><p class="muted">or click to select .jar files · files stay on your device</p>';const input=element("input","hidden");input.type="file";input.accept=".jar";input.multiple;drop.append(input);drop.onclick=()=>input.click();drop.ondragover=e=>{e.preventDefault();drop.classList.add("drag")};drop.ondragleave=()=>drop.classList.remove("drag");drop.ondrop=e=>{e.preventDefault();drop.classList.remove("drag");stage(e.dataTransfer.files)};input.onchange=()=>stage(input.files);p.append(drop);const box=element("div","panel section");box.id="pluginList";p.append(box);drawPlugins()}
function stage(files){for(const f of files){if(!f.name.toLowerCase().endsWith(".jar")){toast("Only .jar plugins are supported");continue}if(!plugins.includes(f.name))plugins.push(f.name)}drawPlugins();toast("Selected locally; no file was uploaded")}
function drawPlugins(){const box=document.getElementById("pluginList");if(!box)return;box.innerHTML="<h2>Staged plugins ("+plugins.length+")</h2>";if(!plugins.length){box.append(element("p","muted","No plugin files selected."));return}const table=element("table","filetable");plugins.forEach(name=>{const tr=element("tr");const td=element("td","",name),status=element("td");status.append(element("span","tag","Not uploaded"));const act=element("td");act.append(button("Remove",()=>{plugins=plugins.filter(x=>x!==name);drawPlugins()},"outline"));tr.append(td,status,act);table.append(tr)});box.append(table)}
function filesPage(p){addNotice(p,"File manager preview. Remote file listing, editing, and uploads will be enabled only after a secure backend is connected.");const box=element("div","panel");box.innerHTML='<h2>Planned server files</h2><table class="filetable"><thead><tr><th>Name</th><th>Type</th><th>Status</th></tr></thead><tbody><tr><td>server.properties</td><td>Configuration</td><td>Local draft available</td></tr><tr><td>paper-global.yml</td><td>Paper YAML</td><td>Not connected</td></tr><tr><td>paper-world-defaults.yml</td><td>Paper YAML</td><td>Not connected</td></tr><tr><td>plugins/</td><td>Folder</td><td>Not connected</td></tr><tr><td>world/</td><td>Folder</td><td>Not connected</td></tr></tbody></table>';p.append(box);p.append(button("Download settings draft",exportProperties,"primary"))}
function worldsPage(p){addNotice(p,"The Google Drive folders exist, but this website is not yet authorized to read or write them. Do not paste API tokens into the browser.");const b=element("div","grid two");for(const [title,desc] of [["World manager","Browse, import, export, and restore worlds after backend integration."],["Backup manager","Create versioned snapshots, verify checksums, and restore selected backups."]]){const card=element("div","panel");card.innerHTML='<h2>'+title+'</h2><p class="muted">'+desc+'</p><span class="tag">Backend required</span>';b.append(card)}p.append(b)}
function playersPage(p){addNotice(p,"Online player list, whitelist edits, bans, and operator permissions require the running server agent.");const card=element("div","panel");card.innerHTML='<h2>Player management</h2><p class="muted">Online players: unavailable</p><p class="muted">Whitelist: '+(settings["white-list"]?"Enabled (draft)":"Disabled (draft)")+'</p><p class="tiny">Keep online-mode enabled and restrict admin access.</p>';p.append(card)}
function consolePage(p){addNotice(p,"Live logs and console commands are unavailable until the server agent is connected. No commands typed here will execute.");p.append(element("pre","console","[preview] Minecraft Cloud dashboard ready.\n[preview] No server backend configured.\n[preview] Start/Stop and RCON disabled."));const form=element("div","toolbar"),inp=element("input","search");inp.placeholder="Server commands unavailable";inp.disabled=true;form.append(inp);const send=button("Send",()=>{},"primary");send.disabled=true;form.append(send);p.append(form)}
function aboutPage(p){const box=element("div","panel");box.innerHTML='<h2>Integration status</h2><table class="filetable"><tbody><tr><td>GitHub</td><td>Repository connected to Pages by owner</td></tr><tr><td>Cloudflare Pages</td><td>Frontend deployment target</td></tr><tr><td>Google Drive</td><td>Folders created; API integration pending</td></tr><tr><td>Playit.gg</td><td>Account created; server agent pending</td></tr><tr><td>Minecraft compute</td><td>Not configured</td></tr></tbody></table><p class="muted small">Configuration values are stored in this browser using localStorage. They are not synchronized to GitHub, Drive, or Minecraft.</p>';p.append(box);addNotice(p,"Security: never place GitHub, Google OAuth, or Playit credentials in frontend JavaScript. Configure secrets only in a trusted server-side backend.")}
init();
</script><script src="/dashboard-live.js" defer></script></body></html>
