[package]
name = "minecraft-cloud-desktop"
version = "0.1.0"
description = "Minecraft Cloud native desktop control center"
authors = ["Minecraft Cloud"]
edition = "2021"
build = "build.rs"

[lib]
name = "minecraft_cloud_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
tokio = { version = "1", features = ["sync", "fs", "io-util", "macros"] }
keyring = { version = "3.6", features = ["windows-native"] }
dirs = "6"
futures-util = "0.3"
urlencoding = "2.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
