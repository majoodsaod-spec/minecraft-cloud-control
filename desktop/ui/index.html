<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Minecraft Cloud</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./apple-unified.css">
<link rel="stylesheet" href="./marketplace.css">
<link rel="stylesheet" href="./server_management.css">
<script src="./marketplace.js" defer></script>
<script src="./server_management.js" defer></script>
<script src="./app.js" defer></script>
</head>
<body>
<div class="window-shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-icon"><span>◆</span></div><div><strong>Minecraft Cloud</strong><small>SERVER MANAGER</small></div></div>
    <div class="sidebar-heading">WORKSPACE</div>
    <nav aria-label="Main navigation">
      <button class="nav active" data-page="overview"><span class="nav-glyph">◫</span> Overview</button>
      <button class="nav" data-page="console"><span class="nav-glyph">⌘</span> Live Console</button>
      <button class="nav" data-page="workflows"><span class="nav-glyph">⎇</span> GitHub Actions</button>
      <button class="nav" data-page="marketplace"><span class="nav-glyph">⬡</span> Plugins & Datapacks</button>
      <button class="nav" data-page="files"><span class="nav-glyph">▤</span> Server Files</button>
      <button class="nav" data-page="settings"><span class="nav-glyph">⚙</span> Server Settings</button>
      <button class="nav" data-page="backups"><span class="nav-glyph">◷</span> World Backups</button>
      <button class="nav" data-page="connections"><span class="nav-glyph">⊞</span> Connections</button>
    </nav>
    <div class="sidebar-bottom">
      <div class="tiny-status"><i id="githubDot" class="status-dot"></i><span id="githubShort">GitHub not connected</span></div>
      <div class="tiny-status"><i id="cloudDot" class="status-dot"></i><span id="cloudShort">Live bridge not connected</span></div>
      
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="breadcrumb"><span>Minecraft Cloud</span><b>/</b><strong id="breadcrumb">Overview</strong></div>
      <div class="topbar-right"><span class="live-time" id="time"></span><button class="btn small flat quick-update-control" id="quickUpdate" data-action="check-update" title="Check GitHub for a newer Minecraft Cloud Windows app"><span id="updateIndicator" class="update-indicator" hidden></span><span id="quickUpdateLabel">Quick Update</span></button><span id="updateStatus" role="status" aria-live="polite" class="update-status"></span><button id="refresh" class="icon-btn" title="Refresh data" aria-label="Refresh">↻</button></div>
    </header>
    <div id="content" class="content"></div>
    <footer class="footer"><span id="footerText">Server management</span><span id="footerVersion">Minecraft Cloud · Windows</span></footer>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="dialogBackdrop" class="dialog-backdrop hidden" aria-hidden="true"><div id="dialog" class="dialog"></div></div>
</body>
</html>
